<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="auto" style="border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="court" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Sky & School Field -->
  <rect width="800" height="260" fill="url(#sky3)"/>
  <rect y="260" width="800" height="240" fill="url(#court)"/>

  <!-- School Building Background -->
  <rect x="50" y="80" width="300" height="180" fill="#fca5a5" stroke="#dc2626" stroke-width="4"/>
  <rect x="180" y="180" width="50" height="80" fill="#475569"/>
  <!-- Windows -->
  <rect x="80" y="110" width="45" height="45" fill="#e0f2fe" stroke="#dc2626" stroke-width="3"/>
  <rect x="150" y="110" width="45" height="45" fill="#e0f2fe" stroke="#dc2626" stroke-width="3"/>
  <rect x="220" y="110" width="45" height="45" fill="#e0f2fe" stroke="#dc2626" stroke-width="3"/>
  <rect x="290" y="110" width="45" height="45" fill="#e0f2fe" stroke="#dc2626" stroke-width="3"/>

  <!-- Big Tree on Right -->
  <rect x="620" y="140" width="45" height="180" fill="#78350f" rx="6"/>
  <circle cx="642" cy="120" r="75" fill="#15803d"/>
  <circle cx="590" cy="140" r="55" fill="#16a34a"/>
  <circle cx="690" cy="140" r="55" fill="#16a34a"/>

  <!-- Bench with Teacher Reading a Book -->
  <rect x="520" y="320" width="130" height="12" fill="#b45309"/> <!-- Bench seat -->
  <line x1="535" y1="332" x2="535" y2="370" stroke="#451a03" stroke-width="6"/>
  <line x1="635" y1="332" x2="635" y2="370" stroke="#451a03" stroke-width="6"/>

  <!-- Teacher Sitting -->
  <circle cx="585" cy="255" r="16" fill="#fde047"/> <!-- Head/hair -->
  <rect x="573" y="271" width="24" height="45" fill="#a855f7" rx="4"/> <!-- Purple shirt -->
  <rect x="568" y="290" width="34" height="20" fill="#0284c7"/> <!-- Book in hands -->

  <!-- Blue Backpacks near tree on ground -->
  <rect x="670" y="340" width="25" height="30" fill="#0284c7" rx="6"/>
  <rect x="700" y="345" width="22" height="25" fill="#0284c7" rx="6"/>

  <!-- Boy Kicking Soccer Ball in Center -->
  <circle cx="360" cy="310" r="15" fill="#fde047"/> <!-- Head -->
  <rect x="350" y="325" width="20" height="38" fill="#ef4444" rx="4"/> <!-- Red shirt -->
  <line x1="360" y1="363" x2="335" y2="420" stroke="#1e293b" stroke-width="8"/> <!-- Leg standing -->
  <line x1="360" y1="363" x2="410" y2="400" stroke="#1e293b" stroke-width="8"/> <!-- Leg kicking -->

  <!-- Soccer Ball -->
  <circle cx="435" cy="405" r="14" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <polygon points="435,397 441,402 439,409 431,409 429,402" fill="#000000"/>

  <!-- Two Girls Skipping Rope on Left -->
  <circle cx="140" cy="320" r="14" fill="#f472b6"/>
  <rect x="131" y="334" width="18" height="35" fill="#eab308" rx="4"/>
  <line x1="140" y1="369" x2="130" y2="420" stroke="#334155" stroke-width="6"/>

  <circle cx="240" cy="320" r="14" fill="#fb923c"/>
  <rect x="231" y="334" width="18" height="35" fill="#a855f7" rx="4"/>
  <line x1="240" y1="369" x2="250" y2="420" stroke="#334155" stroke-width="6"/>

  <!-- Skipping Rope Curve -->
  <path d="M145 350 Q190 440 235 350" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="6,4"/>
</svg>
